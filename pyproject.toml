[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deployer"
version = "0.1.0"
description = "Deploy repositories to user systemd services over SSH"
requires-python = ">=3.11"

[project.scripts]
deployer = "deployer.cli:main"

[tool.setuptools.packages.find]
include = ["deployer*"]
